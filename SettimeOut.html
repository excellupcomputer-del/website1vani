<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>SetTimeOut</h1>
    <h2 id="output">SetTimeOut function :</h2>
</body>
   <script>
    let output = document.getElementById("output")

    setTimeout(function(){
        output.innerText = "SetTimeout :";
    },3000);
   </script>
</html>
