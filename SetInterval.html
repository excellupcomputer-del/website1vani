<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>SetInterval:</h1>
    <h2 id="output">SetInterval Function :</h2>
</body>
<script>
    let output = document.getElementById("output")

    let interval = setInterval(function () {
        // output.innerHTML = "backend";
        console.log("welcome");

    },2000)

    setTimeout(function () {
         output.innerHTML = "backend:"
        clearInterval(interval);
    },10000)
</script>

</html>
